apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: volcast-retrain
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    spec:
      template:
        spec:
          maxRetries: 0
          serviceAccountName: volcast-ingest-sa@ray-volcast-prod.iam.gserviceaccount.com
          timeoutSeconds: 3600
          containers:
            - image: gcr.io/ray-volcast-prod/volcast-ingest:latest
              command: ["python", "-m", "dags.retrain_job"]
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: GCS_BUCKET
                  value: volcast-ray-volcast-prod
                - name: SUPABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: supabase-url
                      key: latest
                - name: SUPABASE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: supabase-key
                      key: latest
