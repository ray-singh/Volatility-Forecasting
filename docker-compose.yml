services:
  # FastAPI inference server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
      LOB_LEVELS: "5"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    networks:
      - volcast
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Streamlit dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      API_URL: "http://api:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./results.json:/app/results.json:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - volcast
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  volcast:
    driver: bridge

volumes:
  models:
    driver: local
  data:
    driver: local
